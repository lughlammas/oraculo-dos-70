[project]
name = "or70"
version = "0.1.0"
requires-python = ">=3.12"
description = "Oráculo dos 70 — núcleo determinístico"
[project.scripts]
or70 = "or70.cli:main"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["or70*"]
